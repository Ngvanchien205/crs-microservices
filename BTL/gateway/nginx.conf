server {
    listen 80;
    server_name localhost;

    # MIME Types Configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # CORS Headers Configuration
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-Idempotency-Key' always;

    # 1. FRONTEND: Student Portal
    location / {
        root /usr/share/nginx/html/student;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. FRONTEND: Hub Staff Portal (QR Scanner PWA)
    location /staff {
        alias /usr/share/nginx/html/staff;
        index index.html;
        try_files $uri $uri/ /staff/index.html;
    }

    # 2.1 FRONTEND: Admin & Finance Portal (Lab 08 & 09)
    location /admin {
        alias /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
    }

    # 3. BACKEND ROUTING: Auth & Identity Service (Port 8001)
    location /api/v1/auth {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. BACKEND ROUTING: Product & Catalog Service (Port 8002)
    location /api/v1/products {
        proxy_pass http://product-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. BACKEND ROUTING: Smart Escrow & Payment Service (Port 8003)
    location /api/v1/escrow {
        proxy_pass http://escrow-service:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 6. BACKEND ROUTING: O2O Hub & Logistics Service (Port 8004)
    location /api/v1/hub {
        proxy_pass http://hub-service:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 7. BACKEND ROUTING: AI Intelligence Engine (FastAPI - Port 8005)
    location /api/v1/ai {
        proxy_pass http://ai-engine:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
